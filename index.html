<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#013989">
  <meta name="description" content="Encuesta de empoderamiento en seguridad de ESM. Respuestas sin nombre ni RUT, con análisis agrupado.">
  <title>ESM | Encuesta de Empoderamiento</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="esm-tema-corporativo.css?v=2">
</head>
<body class="esm-encuesta">
  <header class="topbar">
    <a href="#encuesta" class="identity" aria-label="Ir a la encuesta de ESM">
      <img src="./esm-identidad/logo-esm.svg" alt="ESM - Empresa de Soluciones Mineras" class="brand-logo" width="155" height="51">
    </a>
    <p class="topbar-title">Encuesta de Empoderamiento</p>
    <a class="nav-admin" href="#admin" id="nav-admin">⚙ Administrador</a>
  </header>
  <main id="app" class="main" aria-live="polite" tabindex="-1">
    <div class="card loading"><span class="spinner" aria-hidden="true"></span><p>Preparando encuesta…</p></div>
  </main>
  <footer class="footer">
    <div class="esm-pie">
      <img src="./esm-identidad/logo-esm.svg" width="155" height="51" alt="" loading="lazy">
      <p><strong>ESM · Participación responsable</strong><span>Los resultados se presentan de forma agrupada.</span></p>
    </div>
  </footer>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
